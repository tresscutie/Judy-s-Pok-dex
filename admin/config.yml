backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "portfolio"
    label: "Sample Works"
    folder: "content/portfolio"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Category", name: "category", widget: "select", options: ["UDP", "Template", "Posters", "Hoodset", "Stamp", "Seller Set"]}
      - {label: "Image", name: "image", widget: "image"}
